<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B6B4B"><title>Administration — DO Fast</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--g:#0B6B4B;--y:#F5B700;--ink:#17231e;--muted:#718078;--line:#e7eee9;--bg:#f5f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}#app{max-width:620px;min-height:100vh;margin:auto;padding-bottom:40px}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font:800 24px Manrope;text-decoration:none;letter-spacing:-1px}.brand b{color:var(--g)}.brand span{color:var(--y)}.top a:last-child{font-size:12px;color:var(--g);font-weight:800;text-decoration:none}.page{padding:20px}.hero{background:var(--g);color:#fff;border-radius:22px;padding:22px;margin-bottom:18px}.hero small{color:#c5ead6;font-weight:800;letter-spacing:1px;text-transform:uppercase}.hero h1{font:800 25px Manrope;margin:8px 0}.hero p{font-size:13px;line-height:1.5;color:#e0efe6;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;border:1px solid #dfe8e1;border-radius:11px;padding:13px;font:14px "DM Sans"}.btn{border:0;border-radius:12px;padding:13px 15px;background:var(--g);color:#fff;font-size:12px;font-weight:800}.btn.alt{background:#edf5ef;color:var(--g)}.btn.red{background:#fff0ef;color:#a33933}.btn.full{width:100%}.notice{display:none;padding:12px;border-radius:12px;background:#fff6db;color:#765900;font-size:12px;line-height:1.5;margin:12px 0}.notice.show{display:block}.notice.error{background:#fff0ef;color:#a33933}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tabs button,.tabs a{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--muted);font-weight:800;font-size:12px;text-align:center;text-decoration:none}.tabs button.active{background:var(--g);color:#fff}.hidden{display:none!important}.provider{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.provider h3{font:800 16px Manrope;margin:0 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.6}.bio{font-size:13px;line-height:1.5;margin:12px 0}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef6f0;color:var(--g);font-size:10px;font-weight:700;margin:3px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.empty{text-align:center;color:var(--muted);font-size:13px;padding:25px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.toolbar h2{font:800 18px Manrope}.small{font-size:10px;color:var(--muted);line-height:1.5}
</style></head><body><div id="app"><header class="top"><a class="brand" href="./"><b>DO</b><span>Fast ϟ</span></a><a href="./">Annuaire public</a></header><main class="page"><section class="hero"><small>Espace sécurisé</small><h1>Administration DO Fast</h1><p>Vérification des profils prestataires avant leur publication dans l'annuaire.</p></section><div id="notice" class="notice"></div>
<section id="authBox" class="card"><div class="tabs"><button type="button" id="loginTab" class="active">Connexion</button><a id="signupTab" href="./admin-register.html">Créer le compte responsable</a></div><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" required autocomplete="current-password"></div><button id="loginButton" type="submit" class="btn full">Se connecter</button></form></section>
<section id="dashboard" class="hidden"><div class="card toolbar"><div><h2>Demandes à vérifier</h2><div class="small" id="queueCount"></div></div><button class="btn alt" id="refresh">Actualiser</button></div><div id="queue"></div><button class="btn alt full" id="logout">Se déconnecter</button></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./supabase-config.js"></script><script>
const $=id=>document.getElementById(id),db=window.doFastSupabase;let signup=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notice(t,e=false){$("notice").textContent=t;$("notice").className="notice show"+(e?" error":"")}

async function checkAccess(){const {data,error}=await db.rpc("do_fast_admin_check");if(error)throw error;if(!data){$("authBox").classList.remove("hidden");$("dashboard").classList.add("hidden");notice("Compte connecté, mais aucun droit administrateur n'est encore activé pour cette adresse. Communique au propriétaire DO Fast l'adresse e-mail utilisée (jamais le mot de passe) pour qu'il active ton accès.",true);return} $("authBox").classList.add("hidden");$("dashboard").classList.remove("hidden");await loadQueue()}
async function loadQueue(){notice("Chargement des demandes…");const {data:providers,error}=await db.from("provider_profiles").select("user_id,bio,verification_status,verified,available,created_at").in("verification_status",["pending","rejected"]).order("created_at",{ascending:true});if(error)throw error;const rows=providers||[];$("queueCount").textContent=rows.length+" demande(s) en attente ou à corriger";if(!rows.length){$("queue").innerHTML='<div class="empty">Aucune demande à vérifier pour le moment.</div>';$("notice").className="notice";return}
const ids=rows.map(x=>x.user_id);const [profiles,services,areas,cats,neighborhoods]=await Promise.all([db.from("profiles").select("id,full_name,phone").in("id",ids),db.from("provider_services").select("provider_id,service_id,price_xaf").in("provider_id",ids),db.from("provider_service_areas").select("provider_id,neighborhood_id").in("provider_id",ids),db.from("service_categories").select("id,name"),db.from("neighborhoods").select("id,name")]);
for(const x of [profiles,services,areas,cats,neighborhoods])if(x.error)throw x.error;
const pm=new Map((profiles.data||[]).map(x=>[x.id,x])),cm=new Map((cats.data||[]).map(x=>[x.id,x.name])),nm=new Map((neighborhoods.data||[]).map(x=>[x.id,x.name]));
$("queue").innerHTML=rows.map(p=>{const u=pm.get(p.user_id)||{};const ss=(services.data||[]).filter(x=>x.provider_id===p.user_id).map(x=>(cm.get(x.service_id)||"Service")+" · "+(Number(x.price_xaf)>0?Number(x.price_xaf).toLocaleString("fr-FR")+" FCFA":"Tarif à discuter"));const aa=(areas.data||[]).filter(x=>x.provider_id===p.user_id).map(x=>nm.get(x.neighborhood_id)||"");return '<article class="provider"><h3>'+esc(u.full_name||"Prestataire")+'</h3><div class="meta">☎ '+esc(u.phone||"Téléphone non renseigné")+'<br>Statut : '+esc(p.verification_status)+' · '+new Date(p.created_at).toLocaleDateString("fr-FR")+'</div><p class="bio">'+esc(p.bio||"Aucune présentation")+'</p><div><b class="small">Services et tarifs</b><br>'+ss.map(x=>'<span class="tag">'+esc(x)+'</span>').join("")+'</div><div style="margin-top:8px"><b class="small">Quartiers couverts</b><br>'+aa.map(x=>'<span class="tag">'+esc(x)+'</span>').join("")+'</div><p class="small">Vérifie l’identité et les informations du prestataire par un contrôle réel avant de l’approuver. La validation dans cet espace rendra le profil éligible à l’annuaire ; le prestataire devra ensuite activer sa disponibilité.</p><div class="actions"><button class="btn" data-action="approve" data-id="'+esc(p.user_id)+'">Approuver</button><button class="btn red" data-action="reject" data-id="'+esc(p.user_id)+'">Refuser</button></div></article>'}).join("");$("notice").className="notice"}
$("queue").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const id=b.dataset.id,approve=b.dataset.action==="approve";if(!confirm(approve?"Confirmer que l'identité a été vérifiée et approuver ce profil ?":"Refuser cette demande ?"))return;b.disabled=true;try{const {error}=await db.from("provider_profiles").update({verification_status:approve?"approved":"rejected",verified:approve}).eq("user_id",id);if(error)throw error;notice(approve?"Profil approuvé. Il reste invisible tant que le prestataire n'active pas sa disponibilité.":"Demande refusée.");await loadQueue()}catch(err){notice(err.message,true)}finally{b.disabled=false}});
$("refresh").onclick=()=>loadQueue().catch(e=>notice(e.message,true));$("logout").onclick=async()=>{await db.auth.signOut();$("dashboard").classList.add("hidden");$("authBox").classList.remove("hidden")};
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("loginButton");b.disabled=true;b.textContent="Connexion…";notice("Vérification de vos identifiants…");try{if(!db)throw new Error("Le service de connexion Supabase n'est pas initialisé. Rechargez la page.");const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;if(!data.session)throw new Error("Connexion non confirmée. Vérifiez votre adresse et votre mot de passe.");notice("Connexion réussie. Vérification des droits administrateur…");await checkAccess()}catch(err){notice(err?.message||"Une erreur inattendue est survenue pendant la connexion.",true)}finally{b.disabled=false;b.textContent="Se connecter"}});

(async()=>{if(!db){notice("Connexion à Supabase indisponible.",true);return}const {data}=await db.auth.getSession();if(data.session){try{await checkAccess()}catch(e){notice(e.message,true)}}})();
</script></body></html>
