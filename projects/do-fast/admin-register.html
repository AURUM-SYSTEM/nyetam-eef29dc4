<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B6B4B"><title>Créer le compte responsable — DO Fast</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#17231e;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:18px 22px}.top a{color:#0B6B4B;text-decoration:none;font-weight:bold}.hero{background:#0B6B4B;color:white;border-radius:18px;padding:22px;margin:18px 0}.card{background:white;border:1px solid #e7eee9;border-radius:18px;padding:20px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #dfe8e1;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:15px;background:#0B6B4B;color:#fff;font-weight:bold;font-size:15px}.btn:disabled{opacity:.6}.notice{display:none;padding:13px;margin:14px 0;border-radius:10px;background:#fff6db;color:#765900;line-height:1.5;font-size:14px}.notice.show{display:block}.notice.error{background:#fff0ef;color:#a33933}.muted{font-size:13px;color:#718078;line-height:1.5}
</style></head><body><header class="top"><a href="./">DO Fast</a><a href="./admin.html">Retour à la connexion</a></header><main class="wrap"><section class="hero"><h1>Créer le compte responsable</h1><p>Crée ton compte personnel pour accéder ensuite à l'administration DO Fast.</p></section><div id="notice" class="notice" role="status" aria-live="polite"></div><section class="card"><p class="muted">L'inscription ne donne pas automatiquement les droits administrateur. Le propriétaire DO Fast doit activer l'accès après la création du compte.</p><form id="signupForm"><div class="field"><label for="adminName">Nom et prénom</label><input id="adminName" required maxlength="100" autocomplete="name"></div><div class="field"><label for="newEmail">Adresse e-mail</label><input id="newEmail" type="email" required autocomplete="email"></div><div class="field"><label for="newPassword">Mot de passe (8 caractères minimum)</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" id="submitBtn" type="submit">Créer mon compte</button></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="./supabase-config.js"></script><script>
const $=id=>document.getElementById(id);function show(t,err=false){$("notice").textContent=t;$("notice").className="notice show"+(err?" error":"")}
$("signupForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("submitBtn");btn.disabled=true;btn.textContent="Création en cours…";try{const db=window.doFastSupabase;if(!db)throw new Error("La connexion à Supabase n'est pas initialisée. Recharge la page et réessaie.");const email=$("newEmail").value.trim().toLowerCase();const {data,error}=await db.auth.signUp({email,password:$("newPassword").value,options:{data:{full_name:$("adminName").value.trim()}}});if(error)throw error;if(data.user&&!data.session){show("Compte créé. Vérifie ta boîte e-mail et clique sur le lien de confirmation. Ensuite, reviens à la page de connexion. L'accès administrateur sera activé séparément.");$("signupForm").reset();}else if(data.user){show("Compte créé avec succès. Tu peux maintenant revenir à la connexion. Les droits administrateur doivent encore être activés séparément.");$("signupForm").reset();}else{show("Supabase n'a pas confirmé la création du compte. Réessaie ou contacte le support.",true)}}catch(err){show(err.message||"Une erreur est survenue pendant la création du compte.",true)}finally{btn.disabled=false;btn.textContent="Créer mon compte"}});
</script></body></html>
