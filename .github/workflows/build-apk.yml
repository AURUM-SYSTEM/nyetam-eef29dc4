name: Build AURUM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PWA_MANIFEST_URL: https://tanstack-start-app.aurumsystem76.workers.dev/manifest.json
      BUBBLEWRAP_KEYSTORE_PASSWORD: aurum-test-keystore
      BUBBLEWRAP_KEY_PASSWORD: aurum-test-keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare signing key
        run: |
          set -euo pipefail
          mkdir -p android
          keytool -genkeypair -v \
            -keystore android/android-keystore \
            -alias aurum \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
            -dname "CN=AURUM SYSTEM, OU=AURUM, O=AURUM SYSTEM, L=Yaounde, ST=Centre, C=CM"

      - name: Generate Android TWA project
        run: |
          set -euo pipefail
          docker pull ghcr.io/googlechromelabs/bubblewrap:1.25.0
          {
            printf '%s\n' 'https://tanstack-start-app.aurumsystem76.workers.dev/manifest.json'
            printf '%s\n' 'AURUM SYSTEM'
            printf '%s\n' 'com.aurumsystem.app'
            printf '%s\n' 'https://tanstack-start-app.aurumsystem76.workers.dev/'
            printf '%s\n' 'android'
            printf '%s\n' 'Android'
            printf '%s\n' 'AURUM SYSTEM'
            printf '%s\n' 'AURUM SYSTEM'
            printf '%s\n' 'Yaounde'
            printf '%s\n' 'Centre'
            printf '%s\n' 'CM'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' '/workspace/android/android-keystore'
            printf '%s\n' 'aurum'
            printf '%s\n' 'aurum-test-keystore'
            printf '%s\n' 'aurum-test-keystore'
          } | docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/android \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            init --manifest="$PWA_MANIFEST_URL" --directory .

      - name: Build signed APK
        run: |
          set -euo pipefail
          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/android \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            build --skipPwaValidation

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f android/app-release-signed.apk
          ls -lh android/app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload Android metadata
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-android-metadata
          path: |
            android/assetlinks.json
            android/twa-manifest.json
          if-no-files-found: warn
          retention-days: 30
