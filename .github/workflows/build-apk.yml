name: Build AURUM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PWA_MANIFEST_URL: https://tanstack-start-app.aurumsystem76.workers.dev/manifest.json
      BUBBLEWRAP_KEYSTORE_PASSWORD: aurum-test-keystore
      BUBBLEWRAP_KEY_PASSWORD: aurum-test-keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Prepare signing key
        run: |
          set -euo pipefail
          mkdir -p android
          keytool -genkeypair -v \
            -keystore android/android-keystore \
            -alias aurum \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
            -dname "CN=AURUM SYSTEM, OU=AURUM, O=AURUM SYSTEM, L=Yaounde, ST=Centre, C=CM"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Generate Android TWA project
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$PWA_MANIFEST_URL"
            printf '%s\n' 'AURUM SYSTEM'
            printf '%s\n' 'com.aurumsystem.app'
            printf '%s\n' 'https://tanstack-start-app.aurumsystem76.workers.dev/'
            printf '%s\n' 'android'
            printf '%s\n' 'Android'
            printf '%s\n' 'AURUM SYSTEM'
            printf '%s\n' 'AURUM SYSTEM'
            printf '%s\n' 'Yaounde'
            printf '%s\n' 'Centre'
            printf '%s\n' 'CM'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' 'N'
            printf '%s\n' '/workspace/android/android-keystore'
            printf '%s\n' 'aurum'
            printf '%s\n' 'aurum-test-keystore'
            printf '%s\n' 'aurum-test-keystore'
          } | bubblewrap init --manifest="$PWA_MANIFEST_URL" --directory android

      - name: Build signed APK
        run: |
          set -euo pipefail
          cd android
          bubblewrap build --skipPwaValidation

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f android/app-release-signed.apk
          ls -lh android/app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload Android metadata
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-android-metadata
          path: |
            android/assetlinks.json
            android/twa-manifest.json
          if-no-files-found: warn
          retention-days: 30
