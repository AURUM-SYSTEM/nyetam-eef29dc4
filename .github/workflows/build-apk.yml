name: Build AURUM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PWA_MANIFEST_URL: https://tanstack-start-app.aurumsystem76.workers.dev/manifest.json
      BUBBLEWRAP_KEYSTORE_PASSWORD: aurum-test-keystore
      BUBBLEWRAP_KEY_PASSWORD: aurum-test-keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.1.0 platforms;android-36

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Prepare signing key
        run: |
          set -euo pipefail
          mkdir -p android
          keytool -genkeypair -v             -keystore android/android-keystore             -alias aurum             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD"             -keypass "$BUBBLEWRAP_KEY_PASSWORD"             -dname "CN=AURUM SYSTEM, OU=AURUM, O=AURUM SYSTEM, L=Yaounde, ST=Centre, C=CM"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Prepare Android SDK for Bubblewrap
        run: |
          set -euo pipefail
          SDKMANAGER_DIR="$(dirname "$(command -v sdkmanager)")"
          mkdir -p "$ANDROID_HOME"
          ln -sfn "$SDKMANAGER_DIR" "$ANDROID_HOME/bin"
          test -x "$ANDROID_HOME/bin/sdkmanager"
          echo "Bubblewrap SDK bin: $ANDROID_HOME/bin"
          ls -la "$ANDROID_HOME/bin"

      - name: Configure Bubblewrap environment
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Generate Android TWA project
        run: |
          set -euo pipefail
          node > /tmp/bubblewrap-input <<'NODE'
          const manifestUrl = process.env.PWA_MANIFEST_URL;
          const m = await (await fetch(manifestUrl)).json();
          const base = new URL(manifestUrl);
          const abs = (v) => v ? new URL(v, base).toString() : "";
          const icon = (m.icons || []).find(i => i.purpose === "any" || !i.purpose)?.src || (m.icons || [])[0]?.src;
          const maskable = (m.icons || []).find(i => String(i.purpose || "").split(/\s+/).includes("maskable"))?.src || "";
          const monochrome = (m.icons || []).find(i => String(i.purpose || "").split(/\s+/).includes("monochrome"))?.src || "";
          const domain = new URL(manifestUrl).hostname;
          const startPath = new URL(m.start_url || "/", base).pathname + (new URL(m.start_url || "/", base).search || "");
          const lines = [
            domain,
            startPath || "/",
            m.name || "AURUM SYSTEM",
            m.short_name || "AURUM",
            "com.aurumsystem.app",
            "1",
            m.display || "standalone",
            m.orientation || "default",
            m.theme_color || "#141414",
            m.background_color || m.theme_color || "#141414",
            abs(icon),
            abs(maskable),
            abs(monochrome),
            "N",
            "N",
            process.env.GITHUB_WORKSPACE + "/android/android-keystore",
            "aurum",
          ];
          process.stdout.write(lines.join("\n") + "\n");
          NODE
          echo "Prepared Bubblewrap answers:"
          sed -E 's#(android-keystore).*#\1#' /tmp/bubblewrap-input
          python3 - <<'PY'
          import os, re, sys, pexpect

          answers = open("/tmp/bubblewrap-input", encoding="utf-8").read().splitlines()
          child = pexpect.spawn(
              "bubblewrap",
              ["init", "--manifest", os.environ["PWA_MANIFEST_URL"], "--directory", "android"],
              encoding="utf-8",
              timeout=120,
          )
          child.logfile = sys.stdout

          prompts = [
              r"Domain:",
              r"URL path:",
              r"Application name:",
              r"Short name:",
              r"Application ID:",
              r"Version code:",
              r"Display mode:",
              r"Orientation:",
              r"Status bar color:",
              r"Splash screen color:",
              r"Icon URL:",
              r"Maskable icon URL:",
              r"Monochrome icon URL:",
              r"Include support for Play Billing?",
              r"Request geolocation permission?",
              r"Key store location:",
              r"Key name:",
          ]

          i = 0
          while i < len(prompts):
              child.expect(prompts[i])
              if i >= len(answers):
                  raise RuntimeError(f"Missing answer for prompt {prompts[i]}")
              child.sendline(answers[i])
              i += 1

          child.expect(pexpect.EOF)
          rc = child.exitstatus if child.exitstatus is not None else child.signalstatus
          if rc not in (0, None):
              raise RuntimeError(f"Bubblewrap init exited with status {rc}")

          if not os.path.isfile("android/twa-manifest.json"):
              raise RuntimeError("Bubblewrap init finished without android/twa-manifest.json")
          print("Bubblewrap init completed and twa-manifest.json exists.")
          PY

      - name: Build signed APK
        run: |
          set -euo pipefail
          cd android
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f android/app-release-signed.apk
          ls -lh android/app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload Android metadata
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-android-metadata
          path: |
            android/assetlinks.json
            android/twa-manifest.json
          if-no-files-found: warn
          retention-days: 30
