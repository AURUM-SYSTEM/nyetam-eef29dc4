name: Build AURUM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PWA_MANIFEST_URL: https://tanstack-start-app.aurumsystem76.workers.dev/manifest.json
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.AURUM_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.AURUM_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.1.0 platforms;android-36

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore stable signing key
        env:
          AURUM_KEYSTORE_BASE64: ${{ secrets.AURUM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AURUM_KEYSTORE_BASE64"
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD"
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          mkdir -p android
          printf '%s' "$AURUM_KEYSTORE_BASE64" | base64 --decode > android/android-keystore
          chmod 600 android/android-keystore
          keytool -list -keystore android/android-keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias aurum >/dev/null
          echo "Stable Android signing key restored."

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Prepare Android SDK for Bubblewrap
        run: |
          set -euo pipefail
          SDKMANAGER_DIR="$(dirname "$(command -v sdkmanager)")"
          mkdir -p "$ANDROID_HOME"
          ln -sfn "$SDKMANAGER_DIR" "$ANDROID_HOME/bin"
          test -x "$ANDROID_HOME/bin/sdkmanager"

      - name: Configure Bubblewrap environment
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          bubblewrap doctor

      - name: Generate Android TWA project
        run: |
          set -euo pipefail
          node > /tmp/bubblewrap-input <<'NODE'
          const manifestUrl = process.env.PWA_MANIFEST_URL;
          const m = await (await fetch(manifestUrl)).json();
          const base = new URL(manifestUrl);
          const abs = (v) => v ? new URL(v, base).toString() : "";
          const icon = (m.icons || []).find(i => i.purpose === "any" || !i.purpose)?.src || (m.icons || [])[0]?.src;
          const maskable = (m.icons || []).find(i => String(i.purpose || "").split(/\s+/).includes("maskable"))?.src || "";
          const monochrome = (m.icons || []).find(i => String(i.purpose || "").split(/\s+/).includes("monochrome"))?.src || "";
          const domain = new URL(manifestUrl).hostname;
          const startPath = new URL(m.start_url || "/", base).pathname + (new URL(m.start_url || "/", base).search || "");
          const lines = [
            domain, startPath || "/", m.name || "AURUM SYSTEM", m.short_name || "AURUM",
            "com.aurumsystem.app", "1", m.display || "standalone", m.orientation || "default",
            m.theme_color || "#141414", m.background_color || m.theme_color || "#141414",
            abs(icon), abs(maskable), abs(monochrome), "N", "Y",
            process.env.GITHUB_WORKSPACE + "/android/android-keystore", "aurum"
          ];
          process.stdout.write(lines.join("\n") + "\n");
          NODE
          python3 - <<'PY'
          import os, sys, pexpect
          answers = open("/tmp/bubblewrap-input", encoding="utf-8").read().splitlines()
          child = pexpect.spawn("bubblewrap", ["init", "--manifest", os.environ["PWA_MANIFEST_URL"], "--directory", "android"], encoding="utf-8", timeout=120)
          child.logfile = sys.stdout
          prompts = [
            r"Domain:", r"URL path:", r"Application name:", r"Short name:", r"Application ID:",
            r"Starting version code for the new app version:", r"Display mode:", r"Orientation:",
            r"Status bar color:", r"Splash screen color:", r"Icon URL:", r"Maskable icon URL:",
            r"Monochrome icon URL:", r"Include support for Play Billing?", r"Request geolocation permission?",
            r"Key store location:", r"Key name:"
          ]
          for i, prompt in enumerate(prompts):
              child.expect(prompt)
              child.sendline("") if i in (6, 7) else child.sendline(answers[i])
          child.expect(pexpect.EOF)
          if not os.path.isfile("android/twa-manifest.json"):
              raise RuntimeError("Bubblewrap init finished without android/twa-manifest.json")
          PY

      - name: Build signed APK
        run: |
          set -euo pipefail
          cd android
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json

      - name: Verify APK and signing certificate
        run: |
          set -euo pipefail
          test -f android/app-release-signed.apk
          keytool -printcert -jarfile android/app-release-signed.apk | grep -E 'Owner:|SHA256:'

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload Android metadata
        uses: actions/upload-artifact@v7
        with:
          name: aurum-system-android-metadata
          path: |
            android/assetlinks.json
            android/twa-manifest.json
          if-no-files-found: warn
          retention-days: 30
