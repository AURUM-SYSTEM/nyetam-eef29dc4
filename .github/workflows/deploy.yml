name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Clé publiable intégrée au bundle client au build. Le secret GitHub
          # prime ; à défaut, la valeur du .env committé est utilisée par Vite.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_TGEoFkxjlF1X26RAXNvssg_G6b_lEyj' }}

      - name: Push runtime secrets to the Worker
        run: |
          for s in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY OPENAI_API_KEY; do
            v="${!s}"
            if [ -z "$v" ]; then
              echo "::error::Le secret GitHub $s est vide ou absent — à renseigner dans Settings > Secrets and variables > Actions"
              exit 1
            fi
            printf '%s' "$v" | npx wrangler secret put "$s" --name tanstack-start-app
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # L'URL Supabase est publique : repli sur sa valeur connue si le
          # secret GitHub n'existe pas. Les autres n'ont aucun repli possible.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ugtsswijcugnfwykbrtb.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
