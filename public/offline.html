<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AURUM — Hors ligne</title>
    <meta name="theme-color" content="#141414" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0d0d0d; color: #f5f3ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { max-width: 420px; width: 100%; text-align: center;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(201,168,76,0.25);
        border-radius: 18px; padding: 28px; backdrop-filter: blur(8px); }
      h1 { font-size: 22px; margin: 0 0 8px; color: #c9a84c; letter-spacing: 0.02em; }
      p  { font-size: 14px; line-height: 1.5; color: rgba(245,243,238,0.75); margin: 0 0 18px; }
      button { background: #c9a84c; color: #0d0d0d; border: 0; border-radius: 10px;
        padding: 10px 18px; font-weight: 600; cursor: pointer; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: #f87171; margin-right: 8px; vertical-align: middle; animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1><span class="dot"></span>AURUM hors ligne</h1>
        <p>Aucune connexion détectée. Vos saisies sont sauvegardées localement et seront
        synchronisées automatiquement dès le retour du réseau.</p>
        <button onclick="location.reload()">Réessayer</button>
      </div>
    </div>
  </body>
</html>
